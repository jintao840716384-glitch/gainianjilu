name: Sync SRD 5.1 content database

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "tools/sync_srd51.py"
      - "tools/同步_srd51.py"
      - ".github/workflows/sync-srd51.yml"

permissions:
  contents: write

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate content database
        run: python tools/sync_srd51.py

      - name: Commit generated files
        env:
          TARGET_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "02_规则内容库"
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "同步 SRD 5.1 内容数据库"
          git push origin "HEAD:${TARGET_BRANCH}"
